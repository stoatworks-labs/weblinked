# WebLinked launcher definition - macos.
#
# CI copies the right one of launchers/{macos,windows,linux}.toml over
# src-tauri/launcher.toml before `tauri build`, because `command` is the one
# field that cannot be platform-neutral and av-launcher's schema is shared with
# the rest of the fleet - adding per-OS keys to it would change every repo.
#
# --headless is a no-op in current WebLinked and is passed only so this config
# also drives an older build, which did have a window to suppress.
#
# --no-settings is deliberately NOT passed: the settings file is how an
# operator's outputs survive a restart, and the launcher supplies only the bind
# address and port, both of which take precedence over the file anyway.
#
# {runtime} is resolved at run time by embedded.rs, and is the whole point of
# this launcher shipping WebLinked inside itself:
#
#   * in a release build it is <app-data>/runtime, where the bundled
#     WebLinked.app.zip was unpacked, un-quarantined and ad-hoc re-signed;
#   * with no archive bundled - every `tauri dev` run - it falls back to
#     /Applications, so this same line drives a separately installed copy.
#
# WebLinked is deliberately NOT nested inside this bundle. An ad-hoc signed
# .app containing five name-matched helper .apps is exactly where Gatekeeper
# approves the outer app and SIGKILLs the helpers silently. See embedded.rs.

[app]
name = "WebLinked"
command = "{runtime}/WebLinked.app/Contents/MacOS/WebLinked"
args = ["--headless", "--bind", "{host}", "--port", "{port}"]
url = "http://{host}:{port}/"
default_port = 7654

[inject]
mode = "args"

# Mirrored from the control page's own palette in src/control/web_assets.h, so
# the panel and the UI it launches look like one application.
[app.theme]
bg = "#14171a"
panel = "#1d2126"
"panel-2" = "#23282e"
border = "#31383f"
text = "#e6eaee"
muted = "#8e9aa6"
dim = "#5a646e"
accent = "#4da3ff"
"accent-soft" = "#16283c"
good = "#35c46a"
