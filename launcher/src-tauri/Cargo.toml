[package]
name = "weblinked-launcher"
version = "0.3.0"
description = "Tray launcher for WebLinked"
authors = ["Allan Sargeant"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "weblinked_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
diag = { path = "crates/diag" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Network interface enumeration for the GUI Interface picker.
if-addrs = "0.13"
# Parse our own launcher.toml (serde).
toml = "1.1"
# Comment-preserving TOML editing so we can patch an app's config file
# (e.g. srt-router's `[web] bind`) without destroying its formatting.
toml_edit = "0.25"

# Unpacking the embedded WebLinked, on the platforms that need a zip reader.
#
# macOS deliberately shells out to `ditto` instead and does NOT take this
# dependency: ditto is the only thing that round-trips the CEF framework's
# symlinks, execute bits and ad-hoc signature, all of which a generic zip
# extractor flattens or drops. See src/embedded.rs.
[target.'cfg(not(target_os = "macos"))'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

# Standalone: keep this out of any parent app cargo workspace.
[workspace]
