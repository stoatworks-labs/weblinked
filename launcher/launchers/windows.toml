# WebLinked launcher definition - windows.
#
# CI copies the right one of launchers/{macos,windows,linux}.toml over
# src-tauri/launcher.toml before `tauri build`, because `command` is the one
# field that cannot be platform-neutral and av-launcher's schema is shared with
# the rest of the fleet - adding per-OS keys to it would change every repo.
#
# Where the NSIS installer puts it. The portable .zip has no fixed
# home, so point this at wherever you unpacked it.
#
# --headless is a no-op in current WebLinked and is passed only so this config
# also drives an older build, which did have a window to suppress.
#
# --no-settings is deliberately NOT passed: the settings file is how an
# operator's outputs survive a restart, and the launcher supplies only the bind
# address and port, both of which take precedence over the file anyway.
#
# `command` points at an INSTALLED WebLinked rather than a copy bundled inside
# this app. Tauri's resource collector follows the CEF framework's symlinks and
# fails, and nesting an ad-hoc signed bundle with five helper .apps inside
# another is exactly where Gatekeeper kills the helpers silently.

[app]
name = "WebLinked"
command = "{runtime}/WebLinked.exe"
args = ["--headless", "--bind", "{host}", "--port", "{port}"]
url = "http://{host}:{port}/"
default_port = 7654

[inject]
mode = "args"

# Mirrored from the control page's own palette in src/control/web_assets.h, so
# the panel and the UI it launches look like one application.
[app.theme]
bg = "#14171a"
panel = "#1d2126"
"panel-2" = "#23282e"
border = "#31383f"
text = "#e6eaee"
muted = "#8e9aa6"
dim = "#5a646e"
accent = "#4da3ff"
"accent-soft" = "#16283c"
good = "#35c46a"
