name: release

# Build WebLinked and publish installable artefacts.
#
# One job per architecture, deliberately. CEF ships a per-architecture binary
# distribution (cmake/FetchCEF.cmake maps to macosarm64 / macosx64 / windows64 /
# linux64), so a "universal" macOS build would need two distributions and a lipo
# pass — see docs/02-building.md. CMakeLists.txt sets CMAKE_OSX_ARCHITECTURES
# before project() for exactly this reason; a build that sets it afterwards
# silently produces a single-arch binary.
#
# OUTPUT BACKENDS DIFFER FROM A LOCAL BUILD, but less than they used to.
# NDI and OMT are always compiled in: both are loaded with dlopen at run time
# and both have their headers vendored (third_party/ndi, third_party/omt) under
# the per-file MIT grants their vendors give, so no SDK is needed to build them.
# Until those NDI headers were vendored, find_package quietly disabled the
# backend on every hosted runner and these artefacts shipped with no NDI at all.
#
# DeckLink and AJA still are not: they link real SDKs, which are not
# redistributable and are absent here. A local build on a machine with those
# SDKs gets more. The release notes say so rather than letting someone discover
# it after downloading.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,   os: macos-14 }
          - { name: windows-x86_64, os: windows-latest }
          - { name: linux-x86_64,  os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux CEF dependencies
        if: runner.os == 'Linux'
        # CEF links GTK and the usual X11/NSS stack; without these the link
        # step fails long after the (slow) CEF download has completed.
        run: |
          sudo apt-get update
          # libavahi-client-dev is headers only: the library itself is opened
          # at run time, so the built binary still runs on a box without it —
          # it just cannot advertise itself. Without the headers at build time
          # the mDNS backend compiles to a stub and no Linux release can be
          # discovered at all, which is a silent loss rather than a build
          # failure. See the note in CMakeLists.txt.
          sudo apt-get install -y \
            libgtk-3-dev libnss3-dev libasound2-dev libxss-dev \
            libxtst-dev libatk-bridge2.0-dev libdrm-dev libgbm-dev \
            libx11-dev libegl1-mesa-dev libgles2-mesa-dev \
            libavahi-client-dev libayatana-appindicator3-dev

      - name: Cache the CEF distribution
        uses: actions/cache@v4
        with:
          # FetchCEF downloads a ~200MB archive per architecture and verifies it
          # by sha1; caching it keeps the run from re-fetching every time.
          path: third_party/cef
          key: cef-${{ matrix.name }}-${{ hashFiles('cmake/FetchCEF.cmake') }}

      - name: Derive version
        id: ver
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="$(sed -n 's/^project(weblinked VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # Linux runners get OOM-killed building libcef_dll_wrapper at full
        # parallelism: the job dies mid-compile with "the runner has received a
        # shutdown signal", which reads like infrastructure flakiness rather
        # than memory exhaustion. Two jobs fits.
        run: cmake --build build --config Release --parallel ${{ runner.os == 'Linux' && 2 || 4 }}

      - name: Report which backends were compiled in
        shell: bash
        # find_package silently disables a missing backend, so state the result
        # instead of leaving it to be discovered at runtime.
        run: |
          grep -E "WEBLINKED_WITH_(NDI|OMT|DECKLINK|AJA)" build/CMakeCache.txt || true

      - name: Fetch the NDI runtime
        shell: bash
        # Bundling the runtime is what makes NDI work on a machine that has
        # never installed the SDK. Permitted: the SDK is royalty-free and may be
        # shipped inside an application folder, provided the licence presented
        # forbids modifying and reverse-engineering it - which rl_eula adds to
        # the installer EULA. The repository still carries no NDI binaries; only
        # the released artefact does.
        #
        # Each platform packages its runtime differently, so each is unpacked
        # its own way. All three recipes were verified by hand before being
        # written here.
        run: |
          set -euo pipefail
          rt="$RUNNER_TEMP/ndi-rt"; mkdir -p "$rt"
          case "$RUNNER_OS" in
            macOS)
              curl -sL -o "$rt/r.pkg" "http://ndi.link/NDIRedistV6Apple"
              pkgutil --expand "$rt/r.pkg" "$rt/exp"
              tar xzf "$rt/exp/libNDIComponent.pkg/Payload" -C "$rt"
              ;;
            Linux)
              curl -sL -o "$rt/sdk.tar.gz" \
                "https://downloads.ndi.tv/SDK/NDI_SDK_Linux/Install_NDI_SDK_v6_Linux.tar.gz"
              tar xzf "$rt/sdk.tar.gz" -C "$rt"
              sh="$(find "$rt" -maxdepth 1 -name 'Install_NDI_SDK*_Linux.sh' | head -1)"
              # Self-extracting: the tarball starts after this marker line.
              begin="$(awk '/^__NDI_ARCHIVE_BEGIN__/ { print NR+1; exit 0 }' "$sh")"
              tail -n+"$begin" "$sh" | tar xz -C "$rt"
              lib="$(find "$rt" -path '*x86_64-linux-gnu*' -name 'libndi.so.6*' | head -1)"
              cp "$lib" "$rt/"
              cp "$(find "$rt" -name libndi_licenses.txt | head -1)" "$rt/" || true
              ;;
            Windows)
              curl -sL -o "$rt/rt.exe" \
                "https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20Runtime.exe"
              # Run the vendor's own installer rather than unpacking it. Stock
              # 7z cannot read an Inno Setup archive - it exits 0 having
              # extracted nothing, which silently produced an artefact with no
              # DLL in it. Silent install is what Vizrt documents anyway.
              "$rt/rt.exe" //VERYSILENT //NORESTART //SUPPRESSMSGBOXES || true
              for d in "/c/Program Files/NDI/NDI 6 Runtime/v6" \
                       "/c/Program Files/NDI/NDI 6 Runtime" \
                       "/c/Program Files/NDI/NDI 5 Runtime/v5"; do
                if [ -f "$d/Processing.NDI.Lib.x64.dll" ]; then
                  cp "$d/Processing.NDI.Lib.x64.dll" "$rt/"
                  cp "$d"/*Licenses.txt "$rt/libndi_licenses.txt" 2>/dev/null || true
                  break
                fi
              done
              ;;
          esac
          # Never let a silent extraction failure produce an artefact that looks
          # complete and has no runtime in it - that is the exact bug this whole
          # change exists to fix.
          case "$RUNNER_OS" in
            macOS)   want=libndi.dylib ;;
            Linux)   want=libndi.so.6 ;;
            Windows) want=Processing.NDI.Lib.x64.dll ;;
          esac
          if ! ls "$rt/$want"* >/dev/null 2>&1; then
            echo "::error::NDI runtime fetch produced no $want in $rt" >&2
            ls -la "$rt" >&2
            exit 1
          fi
          echo "RL_NDI_DIR_$(echo '${{ matrix.name }}' | tr '[:lower:]-' '[:upper:]_')=$rt" >> "$GITHUB_ENV"
          ls -la "$rt" | head

      - name: Installers (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # Ad-hoc signed before packaging. CEF makes this load-bearing: the app
        # has five name-matched helper .apps nested inside it, and approving
        # the outer bundle does not unquarantine them — Gatekeeper SIGKILLs a
        # quarantined helper silently, which looks like the renderer simply
        # never starting.
        run: |
          source scripts/release-lib.sh
          # Published artefacts are named from scripts/release-file-slug, which
          # rl_init reads. Deliberately not exported here as well: the variable
          # beats the file, so a second copy of the value would silently win if
          # the two ever drifted.
          rl_init "WebLinked" weblinked "${{ steps.ver.outputs.version }}" \
            com.stoatworks.weblinked "$GITHUB_WORKSPACE"
          app="build/Release/WebLinked.app"
          if [ ! -d "$app" ]; then echo "no .app produced" >&2; exit 1; fi
          echo "--- helper apps (CEF needs all five) ---"
          ls "$app/Contents/Frameworks/"
          stage="$RUNNER_TEMP/stage-mac"
          rm -rf "$stage"; mkdir -p "$stage"
          cp -R "$app" "$stage/"
          cp README.md LICENSE "$stage/" 2>/dev/null || true
          # Before signing: the bundle is signed inside-out, so anything added
          # afterwards falls outside the signature.
          rl_ndi_bundle "${{ matrix.name }}" "$stage" --app "WebLinked.app"
          export RL_EULA="$(rl_eula "$PWD/LICENSE")"
          rl_adhoc_sign "$stage/WebLinked.app"
          rl_dmg "${{ matrix.name }}" "$stage" --app "WebLinked.app"
          rl_pkg "${{ matrix.name }}" "$stage" --app "WebLinked.app"

      - name: Archive (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp -R build/Release/* out/
          else
            cp -R build/Release/* out/ 2>/dev/null || cp -R build/* out/
          fi
          cp README.md LICENSE out/ 2>/dev/null || true
          source scripts/release-lib.sh
          rl_init "WebLinked" weblinked "${{ steps.ver.outputs.version }}" \
            com.stoatworks.weblinked "$RUNNER_TEMP"
          rl_ndi_bundle "${{ matrix.name }}" "out"
          # Named by hand rather than through rl_zip/rl_tar, so RL_FILE_SLUG has
          # to be spelled out here too or these two would keep the old name
          # while the macOS artefacts changed.
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$RL_FILE_SLUG-${{ steps.ver.outputs.version }}-${{ matrix.name }}.zip" ./out/*
          else
            tar czf "$RL_FILE_SLUG-${{ steps.ver.outputs.version }}-${{ matrix.name }}.tar.gz" -C out .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: weblinked-${{ matrix.name }}
          path: |
            *.zip
            *.tar.gz
            *.dmg
            *.pkg
          if-no-files-found: error
  windows-installer:
    name: Windows installer
    needs: build
    runs-on: ubuntu-latest
    # makensis cross-compiles, so the installer is wrapped here from the zip the
    # Windows job uploaded rather than depending on whatever NSIS the Windows
    # image happens to carry.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installer
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="$(sed -n 's/^project(weblinked VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" ;;
          esac
          # RL_FILE_SLUG names the .exe and comes from scripts/release-file-slug.
          # RL_SLUG stays `weblinked`, so the Add/Remove Programs key an existing
          # install already wrote is the one this one updates.
          rl_init "WebLinked" weblinked "$version" com.stoatworks.weblinked "$PWD/installers"
          zip="$(find artifacts -name "$RL_FILE_SLUG-*-windows-x86_64.zip" | head -1)"
          if [ -z "$zip" ]; then echo "no Windows artefact, nothing to do"; exit 0; fi
          stage="$RUNNER_TEMP/stage-win"
          rm -rf "$stage"; mkdir -p "$stage"
          unzip -q "$zip" -d "$stage"
          rl_nsis windows-x86_64 "$stage" --gui "WebLinked.exe"
          ls -l installers

      - uses: actions/upload-artifact@v4
        with:
          name: weblinked-windows-installer
          path: installers/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List what is about to be published
        # download-artifact takes *every* artifact when given no name and the
        # upload below globs artifacts/**/*, so what lands on the release is
        # worth stating out loud. v0.7.0 shipped two embed archives — 135 MB and
        # 339 MB — beside the real installers before anyone noticed.
        run: |
          echo "publishing:"
          find artifacts -type f -printf '  %f\n' | sort

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          body: |
            **macOS** — `.pkg` installs WebLinked into /Applications; `.dmg` lets you drag it.
            Apple Silicon only: CEF's binary distribution is per-architecture, so an Intel or
            universal build needs a second distribution and a lipo pass.

            **Windows** — `-setup.exe` installs with shortcuts; `.zip` is portable. x86_64.

            **Linux** — portable `.tar.gz`, x86_64.

            **WebLinked Launcher** — tray app (`WebLinked Launcher_*`), and now the easiest
            way to install. It **carries WebLinked inside it**, unpacking it on first run, so
            this one download is all you need; the separate WebLinked installers above are for
            a rack or CLI machine where a tray is no use. It starts and stops WebLinked, lets
            you pick which network interface the control page binds to, and opens it in your
            browser. WebLinked itself opens no window for an operator: it is a render host and
            a control server, and the control page it serves is the whole UI.

            **Output backends in these builds:** NDI, OMT, the fullscreen screen output and the
            preview. The NDI SDK headers are vendored and the runtime is bundled into the
            artefact, so NDI works on a machine that has never installed it. DeckLink and AJA
            are located with `find_package` and silently disabled when their SDKs are absent,
            which they are on hosted runners — build locally with those SDKs installed to get
            SDI out. See docs/02-building.md.

            Verification status is in docs/04-verification.md, which is the authority: NDI is
            confirmed end-to-end against a real receiver, DeckLink against a real Duo 2, and the
            screen output across two displays on the author's Mac. AJA and OMT compile against
            the real SDKs and have never met hardware or a receiver, and the screen output's
            Windows and Linux backends have never been run.

            Builds are unsigned. On macOS, after installing:

            ```
            xattr -dr com.apple.quarantine "/Applications/WebLinked.app"
            ```

            That step matters more here than usual — the app nests five CEF helper .apps, and
            approving the outer bundle does not unquarantine them. A quarantined helper is
            killed silently and looks like the renderer simply failing to start.
          generate_release_notes: true
