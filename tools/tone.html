<!doctype html><meta charset="utf-8"><title>tone</title>
<style>body{margin:0;background:#000;color:#0f0;font:600 64px/2 monospace;padding:40px}</style>
<div>AUDIO TEST <span id="s">-</span></div>
<script>
const ctx = new AudioContext({sampleRate: 48000});
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.frequency.value = 1000; gain.gain.value = 0.5;
osc.connect(gain).connect(ctx.destination); osc.start();
setInterval(() => { document.getElementById('s').textContent =
  ctx.state + ' ' + ctx.sampleRate + 'Hz ' + ctx.currentTime.toFixed(1) + 's'; }, 100);
</script>
